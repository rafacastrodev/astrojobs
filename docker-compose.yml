services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - astrojobs_db_data:/var/lib/postgresql/data
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
  frontend:
    build: ./apps/web
    expose:
      - "80"
  api:
    build: ./apps/api
    expose:
      - "8000"

volumes:
  astrojobs_db_data:
