services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - astrojobs:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
  localstack:
    image: localstack/localstack:4
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
  frontend:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - api
  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # Without these the container falls back to the local "db" service and
      # silently ignores an external database.
      - POSTGRES_HOST=${POSTGRES_HOST:-}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      # libpq reads these directly, which is how TLS verification survives:
      # the URL is rebuilt from parts, so sslmode in it would be dropped.
      - PGSSLMODE=${PGSSLMODE:-}
      - PGSSLROOTCERT=${PGSSLROOTCERT:-}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_MINUTES=${JWT_EXPIRES_MINUTES:-10080}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PINECONE_API_KEY=${PINECONE_API_KEY:-}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-}
      - PINECONE_NAMESPACE_RESUMES=${PINECONE_NAMESPACE_RESUMES:-resumes}
      - PINECONE_NAMESPACE_JOBS=${PINECONE_NAMESPACE_JOBS:-jobs}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-384}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-astrojobs-resumes}
      - AWS_S3_ENDPOINT_URL=${AWS_S3_ENDPOINT_URL:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-}
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES:-5242880}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  astrojobs:
