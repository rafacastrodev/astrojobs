services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - astrojobs:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
  frontend:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
  api:
    build: ./apps/api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PGSSLMODE: ${PGSSLMODE:-disable}
      PGSSLROOTCERT: ${PGSSLROOTCERT:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-10080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://astrojobs.rafacastro.dev}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME}
      PINECONE_NAMESPACE_RESUMES: ${PINECONE_NAMESPACE_RESUMES:-resumes}
      PINECONE_NAMESPACE_JOBS: ${PINECONE_NAMESPACE_JOBS:-jobs}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-nano}
      OPENAI_MODERATION_MODEL: ${OPENAI_MODERATION_MODEL:-omni-moderation-latest}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-20}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_BEARER_TOKEN_BEDROCK: ""
      AWS_BEDROCK_TOKEN: ""
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AGENTCORE_GATEWAY_URL: ${AGENTCORE_GATEWAY_URL:-}
      AGENTCORE_RETRIEVE_TOOL: ${AGENTCORE_RETRIEVE_TOOL:-}
      AWS_BEDROCK_KB_NAME: ${AWS_BEDROCK_KB_NAME:-}
      AWS_BEDROCK_DATA_SOURCE: ${AWS_BEDROCK_DATA_SOURCE:-}
      AWS_BEDROCK_GATEWAY: ${AWS_BEDROCK_GATEWAY:-}
      AWS_BEDROCK_GATEWAY_TARGET: ${AWS_BEDROCK_GATEWAY_TARGET:-astrojobs-target}
      BEDROCK_KNOWLEDGE_BASE_ID: ${BEDROCK_KNOWLEDGE_BASE_ID:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      MAX_LLM_INPUT_CHARS: ${MAX_LLM_INPUT_CHARS:-50000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 15s

volumes:
  astrojobs:
