server {
    listen 80 default_server;
    server_name astrojobs.rafacastro.dev _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://astrojobs.rafacastro.dev$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name astrojobs.rafacastro.dev _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;

    ssl_certificate /etc/letsencrypt/live/astrojobs.rafacastro.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/astrojobs.rafacastro.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    client_max_body_size 8m;

    location /api/analysis {
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_read_timeout 180s;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
