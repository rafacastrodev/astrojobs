[project]
name = "api"
version = "0.1.0"
description = "AstroJobs API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt>=5.0.0",
    "build>=1.5.0",
    "cython>=3.2.9",
    "fastapi[standard]>=0.141.1",
    "numpy>=2",
    "openapi-generator-cli>=7.24.0",
    "pinecone>=9.1.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pylint>=4.0.7",
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "sqlalchemy>=2.0.52",
]

[tool.uv]
package = false

[tool.pyrefly]
search-path = ["src"]
disable-search-path-heuristics = true

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.params.Query",
    "fastapi.File",
    "fastapi.params.File",
    "fastapi.Form",
    "fastapi.params.Form",
    "fastapi.Cookie",
    "fastapi.params.Cookie",
]
