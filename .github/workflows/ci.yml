name: ci-cd

on:
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2
  EC2_INSTANCE_ID: i-079d9fce38404b208
  DEPLOY_BUCKET: astrojobs-s3
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::956112822284:role/astrojobs-github-deploy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and build containers
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose build api frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy with Systems Manager
        run: scripts/deploy-ci.sh
