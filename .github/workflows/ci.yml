name: ci-cd

on:
  push:
    branches:
      - main

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
  POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  JWT_EXPIRES_MINUTES: ${{ secrets.JWT_EXPIRES_MINUTES }}
  PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
  PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
  PINECONE_NAMESPACE_RESUMES: ${{ secrets.PINECONE_NAMESPACE_RESUMES }}
  PINECONE_NAMESPACE_JOBS: ${{ secrets.PINECONE_NAMESPACE_JOBS }}
  EMBEDDING_DIMENSIONS: ${{ secrets.EMBEDDING_DIMENSIONS }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
  BEDROCK_MODEL_ID: ${{ secrets.BEDROCK_MODEL_ID }}
  MAX_UPLOAD_BYTES: ${{ secrets.MAX_UPLOAD_BYTES }}
  FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}
  EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Compose .env
        run: |
          umask 077
          case "${FRONTEND_ORIGIN}" in
            https://*) cookie_secure=true ;;
            *)         cookie_secure=false ;;
          esac
          cat > .env <<EOF
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_HOST=${POSTGRES_HOST}
          PGSSLMODE=verify-full
          PGSSLROOTCERT=/etc/ssl/certs/rds-global-bundle.pem
          JWT_SECRET=${JWT_SECRET}
          JWT_EXPIRES_MINUTES=${JWT_EXPIRES_MINUTES:-10080}
          COOKIE_SECURE=${cookie_secure}
          FRONTEND_ORIGIN=${FRONTEND_ORIGIN}
          ENVIRONMENT=production
          PINECONE_API_KEY=${PINECONE_API_KEY}
          PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME}
          PINECONE_NAMESPACE_RESUMES=${PINECONE_NAMESPACE_RESUMES:-resumes}
          PINECONE_NAMESPACE_JOBS=${PINECONE_NAMESPACE_JOBS:-jobs}
          EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-1024}
          AWS_REGION=${AWS_REGION}
          AWS_S3_BUCKET=${AWS_S3_BUCKET}
          AWS_S3_ENDPOINT_URL=
          BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-}
          MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES:-5242880}
          EOF

      - name: Start database
        run: docker compose up -d --wait db

      - name: Build and start API
        run: |
          POSTGRES_HOST=db PGSSLMODE= docker compose up -d --build api
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:8000/health || true)
            if [ "$code" = "200" ]; then
              echo "API health check passed"
              exit 0
            fi
            sleep 5
          done
          docker compose logs --tail=500 api
          container_id=$(docker compose ps -q api)
          docker inspect --format '{{json .State}}' "$container_id"
          exit 1

      - name: Stop containers
        if: always()
        run: docker compose down

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${EC2_SSH_KEY}" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${EC2_HOST}
            User ${EC2_USER}
            IdentityFile ~/.ssh/deploy.pem
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: Compose .env
        run: |
          umask 077
          case "${FRONTEND_ORIGIN}" in
            https://*) cookie_secure=true ;;
            *)         cookie_secure=false ;;
          esac
          echo "COOKIE_SECURE=${cookie_secure} (from FRONTEND_ORIGIN)"
          cat > .env.deploy <<EOF
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_HOST=${POSTGRES_HOST}
          PGSSLMODE=verify-full
          PGSSLROOTCERT=/etc/ssl/certs/rds-global-bundle.pem
          JWT_SECRET=${JWT_SECRET}
          JWT_EXPIRES_MINUTES=${JWT_EXPIRES_MINUTES:-10080}
          COOKIE_SECURE=${cookie_secure}
          FRONTEND_ORIGIN=${FRONTEND_ORIGIN}
          ENVIRONMENT=production
          PINECONE_API_KEY=${PINECONE_API_KEY}
          PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME}
          PINECONE_NAMESPACE_RESUMES=${PINECONE_NAMESPACE_RESUMES:-resumes}
          PINECONE_NAMESPACE_JOBS=${PINECONE_NAMESPACE_JOBS:-jobs}
          EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-1024}
          AWS_REGION=${AWS_REGION}
          AWS_S3_BUCKET=${AWS_S3_BUCKET}
          AWS_S3_ENDPOINT_URL=
          BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-}
          MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES:-5242880}
          EOF

      - name: Ship code to host
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude '.venv' \
            --exclude 'dist' --exclude '__pycache__' --exclude '*.pyc' \
            --exclude '.env' --exclude '.env.deploy' \
            ./ deploy-target:~/astrojobs/
          scp .env.deploy deploy-target:~/astrojobs/.env
          ssh deploy-target 'chmod 600 ~/astrojobs/.env'

      - name: Deploy
        run: |
          ssh deploy-target 'bash -s' <<'DEPLOY'
          set -euo pipefail
          cd ~/astrojobs
          sg docker -c 'docker compose up -d --build --remove-orphans'
          sg docker -c 'docker compose ps'
          DEPLOY

      - name: Verify deployment
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://${EC2_HOST}/health" || true)
            if [ "$code" = "200" ]; then
              echo "health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "health check never returned 200 (last: ${code:-none})"
          ssh deploy-target "cd ~/astrojobs && sg docker -c 'docker compose logs --tail=100 api frontend'"
          exit 1
